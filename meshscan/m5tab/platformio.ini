; MeshScan - M5Tab (ESP32-S3) PlatformIO project
;
; Target: ESP32-S3, 8MB PSRAM (OPI), 16MB flash, 1024x600 touch display, SD slot.
; Adjust `board` to your exact M5Tab variant if a dedicated board def exists;
; esp32-s3-devkitc-1-n16r8 matches 16MB flash / 8MB PSRAM.

[platformio]
default_envs = m5tab

[env:m5tab]
platform  = espressif32
board     = esp32-s3-devkitc-1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; --- PSRAM (OPI) + large-mesh allocation -----------------------------------
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    ; UART2 pins to the Unit V — match your wiring (see config in main.cpp)
    -DUNITV_UART_RX=18
    -DUNITV_UART_TX=17
    -DUNITV_UART_BAUD=115200
    ; SD SPI pins — adjust to the M5Tab's slot
    -DSD_CS_PIN=4
    -DSD_SCK_PIN=36
    -DSD_MISO_PIN=37
    -DSD_MOSI_PIN=35
build_unflags =
    -std=gnu++11

lib_deps =
    lvgl/lvgl @ ^8.4.0
    bitbank2/JPEGDEC @ ^1.6.1

; The existing 3D mesh renderer lives in lib/MeshRenderer (see that folder's
; README). PlatformIO links anything under lib/ automatically.
